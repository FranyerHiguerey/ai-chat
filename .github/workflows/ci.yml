name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The packages must install on their own from a tarball: no sibling
      # dependencies (they would break pnpm 11 installs from URLs).
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm -r --filter './packages/*' pack --pack-destination "$RUNNER_TEMP/pack"
          for t in "$RUNNER_TEMP"/pack/*.tgz; do
            tar -xzOf "$t" package/package.json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);const bad=Object.keys(p.dependencies||{}).filter(k=>k.startsWith("@franyerhiguerey/"));if(bad.length){console.error(p.name+" depends on "+bad);process.exit(1)}console.log("ok "+p.name+"@"+p.version)})'
          done
